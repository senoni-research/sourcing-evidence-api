[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "senoni-sourcing-evidence-api"
version = "0.1.0"
description = "A bounded supplier price-change evidence API, using fictional data."
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.2", "pydantic==2.14.3", "uvicorn==0.54.0", "httpx==0.28.1", "python-multipart==0.0.33", "pypdf==7.0.0", "reportlab==5.1.0", "google-cloud-firestore==2.34.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sourcing_api = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
